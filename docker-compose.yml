version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: tanggap_lampung_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peringatan_dini
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tanggap_lampung_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/peringatan_dini
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
